# Test-only datasource. H2 runs fully in-memory, so tests never touch the
# developer's real Postgres database and require no external service.
#
# NON_KEYWORDS=MONTH tells H2 to treat MONTH as an ordinary identifier.
#
# H2 reserves MONTH and so rejects "create table contributions (month
# varchar(255))", which made Hibernate log a DDL failure, continue silently,
# and leave the contributions table missing -- every write then failed with
# "Table CONTRIBUTIONS not found".
#
# MONTH is *unreserved* in PostgreSQL (pg_get_keywords: unreserved, requires
# AS), so the production column is valid and must not be renamed to satisfy a
# test-only database. Relaxing the keyword in H2 keeps the entity matching the
# real schema instead.
spring.datasource.url=jdbc:h2:mem:investhand;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=MONTH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate builds the schema from the entities for each test run.
spring.jpa.hibernate.ddl-auto=create-drop
# H2's dialect is auto-detected; setting it explicitly raises a deprecation warning.
spring.jpa.show-sql=false

spring.jpa.open-in-view=false

app.seed.admin-username=testadmin
app.seed.admin-email=testadmin@example.com
app.seed.admin-password=TestOnly-Password-123

logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN