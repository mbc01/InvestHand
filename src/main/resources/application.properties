spring.application.name=Family_investment_scheme_db

# ---------------------------------------------------------------------------
# DataSource credentials are supplied via environment variables so that no
# secrets are committed to version control.
#
# Local development: create a git-ignored file next to this one:
#   src/main/resources/application-local.properties
# with:
#   spring.datasource.password=<your local password>
# then run with:  --spring.profiles.active=local
#
# Production: supply SPRING_DATASOURCE_PASSWORD as an environment variable.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Family_investment_scheme_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Seeded administrator.
#
# These map ADMIN_USERNAME / ADMIN_EMAIL / ADMIN_PASSWORD onto the
# app.seed.* keys that DatabaseSeeder reads. Without them the environment
# variables were silently ignored: the seeder saw an empty
# app.seed.admin-password and refused to create an admin, logging a warning
# that named ADMIN_PASSWORD as the fix even though nothing read that name.
#
# No defaults are supplied for the password on purpose, so an unset variable
# means no admin is created rather than one with a known password.
app.seed.admin-username=${ADMIN_USERNAME:admin}
app.seed.admin-email=${ADMIN_EMAIL:admin@example.com}
app.seed.admin-password=${ADMIN_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Do not hold the persistence context open across the view-rendering phase.
spring.jpa.open-in-view=false

# The whole application is served as a stateless JSON API, so sessions and
# "remember me" cookies are not needed. Disabling them also removes the
# session fixation surface that comes with JSESSIONID. The policy itself is
# applied in SecurityConfig via SessionCreationPolicy.STATELESS.

management.endpoints.web.exposure.include=health,info